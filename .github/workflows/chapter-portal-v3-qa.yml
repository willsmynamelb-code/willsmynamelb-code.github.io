name: T.Y.M.E. Chapter Portal V3 Review
on:
  push:
    branches:
      - tyme-chapter-portal-v3-review-2026-11-16
permissions:
  contents: read
jobs:
  screenshot-and-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: npm install --no-save --no-package-lock playwright-core
      - name: Render and test chapter portal
        run: |
          mkdir -p v3-review/screenshots
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const {chromium}=require('playwright-core');
          const exe=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(x=>fs.existsSync(x));
          if(!exe)throw Error('Chrome executable not found');
          const cases=[
            {name:'desktop-1440',width:1440,height:900},
            {name:'laptop-1024',width:1024,height:768},
            {name:'mobile-390',width:390,height:844},
            {name:'mobile-320',width:320,height:700}
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:exe,args:['--no-sandbox']});
            const results=[];
            for(const v of cases){
              const page=await browser.newPage({viewport:{width:v.width,height:v.height},deviceScaleFactor:1});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.route(/^https?:/,r=>r.abort());
              await page.goto('file://'+path.join(process.cwd(),'index.html'),{waitUntil:'load'});
              await page.locator('.journey-browser').screenshot({path:'v3-review/screenshots/'+v.name+'-january.png'});
              await page.locator('[data-month="1"]').click();
              const feb=await page.locator('#monthHeading').textContent();
              const febSummary=await page.locator('#monthSummary').textContent();
              const febIndex=await page.locator('#monthIndex').getAttribute('aria-label');
              await page.locator('.journey-browser').screenshot({path:'v3-review/screenshots/'+v.name+'-february.png'});
              let sequential=true,active=true,descriptions=true;
              for(let i=0;i<12;i++){
                await page.locator('[data-month="'+i+'"]').click();
                const title=await page.locator('#monthDescription').textContent();
                const summary=await page.locator('#monthSummary').textContent();
                sequential=sequential&&(await page.locator('#monthIndex').getAttribute('aria-label')==='Month '+(i+1)+' of 12');
                active=active&&(await page.locator('.month-pick.active').count()===1)&&
                  (await page.locator('[data-month="'+i+'"]').getAttribute('aria-pressed')==='true');
                descriptions=descriptions&&title.trim().length>4&&summary.trim().length>45;
              }
              await page.locator('[data-month="0"]').click();
              await page.locator('#monthPrev').click();
              const previousWrap=(await page.locator('#monthHeading').textContent()).trim()==='December';
              await page.locator('#monthNext').click();
              const nextWrap=(await page.locator('#monthHeading').textContent()).trim()==='January';
              await page.locator('[data-month="0"]').focus();
              await page.keyboard.press('End');
              const keyboard=(await page.locator('#monthHeading').textContent()).trim()==='December'&&
                (await page.locator('[data-month="11"]').getAttribute('aria-pressed'))==='true';
              await page.locator('[data-month="0"]').click();
              const pageInfo=await page.evaluate(()=>{
                const ids=[...document.querySelectorAll('[id]')].map(x=>x.id);
                const miss=[...document.querySelectorAll('a[href^="#"]')].map(a=>a.getAttribute('href').slice(1)).filter(id=>id&&!ids.includes(id));
                const sizes=[...document.querySelectorAll('.month-pick')].map(b=>b.getBoundingClientRect());
                const panel=document.querySelector('.month-panel').getBoundingClientRect();
                const art=document.querySelector('.month-panel-accent svg').getBoundingClientRect();
                return {overflow:document.documentElement.scrollWidth>innerWidth,scrollWidth:document.documentElement.scrollWidth,viewport:innerWidth,missingTargets:miss,monthButtons:sizes.length,allTapTargets:sizes.every(x=>x.width>=44&&x.height>=44),panelWidth:Math.round(panel.width),artWidth:Math.round(art.width),hasReader:document.querySelectorAll('.reader-entry').length===7};
              });
              let mobileMenu=true;
              if(v.width<=740){
                await page.locator('#menuButton').click();
                mobileMenu=await page.locator('#menuButton').getAttribute('aria-expanded')==='true';
                await page.keyboard.press('Escape');
                mobileMenu=mobileMenu&&await page.locator('#menuButton').getAttribute('aria-expanded')==='false';
              }
              await page.locator('.book-purchase-row').screenshot({path:'v3-review/screenshots/'+v.name+'-purchase.png'});
              const row={device:v.name,february:{name:feb,hasCorrectSummary:febSummary.includes('seek support'),index:febIndex},sequential,active,descriptions,previousWrap,nextWrap,keyboard,mobileMenu,page:pageInfo,errors};
              row.passed=feb==='February'&&row.february.hasCorrectSummary&&febIndex==='Month 2 of 12'&&sequential&&active&&descriptions&&previousWrap&&nextWrap&&keyboard&&mobileMenu&&
                 !pageInfo.overflow&&pageInfo.missingTargets.length===0&&pageInfo.monthButtons===12&&pageInfo.allTapTargets&&(pageInfo.artWidth>50||(v.width<=370&&pageInfo.artWidth===0))&&pageInfo.hasReader&&errors.length===0;
              results.push(row);
              await page.close();
            }
            await browser.close();
            fs.writeFileSync('v3-review/results.json',JSON.stringify(results,null,2));
            console.log('TYME_V3_RESULTS '+JSON.stringify(results));
            if(results.some(x=>!x.passed))process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tyme-v3-chapter-portal-screenshots
          path: v3-review/
