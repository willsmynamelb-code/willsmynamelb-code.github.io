# Temporary local-only preview transport. NO PUBLICATION OR DEPLOYMENT.
name: Phase 1 temporary local preview source (no deploy)
on:
  push:
    branches: [phase1-approved-figma-implementation]
    paths: [.github/workflows/phase1-temporary-preview-source.yml]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bundle existing public website assets only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview-export
          tar czf preview-export/site-local-only.tar.gz             index.html analytics-off.html favicon.svg             illuminated-path-hero.svg phase1-illuminated.css             tyme-sober-companion-cover.webp tyme-original-cover.webp             fonts/inter-latin-variable.woff2 fonts/libre-baskerville-regular.woff2 fonts/libre-baskerville-italic.woff2
      - name: Upload source for isolated local testing only
        uses: actions/upload-artifact@v4
        with:
          name: phase1-local-transport
          path: preview-export/site-local-only.tar.gz
          retention-days: 1
