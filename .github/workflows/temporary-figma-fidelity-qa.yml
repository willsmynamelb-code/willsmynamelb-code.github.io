# Temporary isolated QA on the approved development branch; NO deployment.
name: Phase 1 Figma visual-fidelity browser QA (NO DEPLOY)
on:
  push:
    branches: [phase1-figma-visual-fidelity-hero]
    paths:
      - phase1-illuminated.css
      - .github/workflows/temporary-figma-fidelity-qa.yml
permissions:
  contents: read
jobs:
  local-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated local QA tools
        run: npm install --no-save playwright @axe-core/playwright
      - name: Execute original regression suite using runner Chrome
        shell: bash
        run: |
          set -euo pipefail
          cp qa/phase1-browser-qa.mjs /tmp/original-qa.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('qa/phase1-browser-qa.mjs')
          s=p.read_text()
          old='chromium.launch({ headless:true });'
          assert s.count(old)==1
          p.write_text(s.replace(old, "chromium.launch({ headless:true, executablePath:'/usr/bin/google-chrome' });"))
          PY
          node qa/phase1-browser-qa.mjs
          node - <<'NODE'
          const fs=require('fs');
          const qa=JSON.parse(fs.readFileSync('qa-results/report.json'));
          if(qa.summary.failed)throw Error('Browser QA failed');
          if(qa.summary.total<90)throw Error('QA coverage unexpectedly reduced');
          for(const v of qa.viewports){
            if(v.scrollWidth>v.width+1)throw Error('Horizontal overflow '+v.width);
          }
          console.log('FIGMA HERO QA',JSON.stringify({passed:qa.summary.passed,total:qa.summary.total,
            viewports:qa.viewports.map(v=>({width:v.width,cover:v.heroCover,factsY:v.factsY}))}));
          NODE
      - name: Save rendered browser screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-fidelity-qa-screenshots
          path: qa-results/
          retention-days: 3
