name: Temporary artwork-crop visual comparison (NO DEPLOY)
on:
  push:
    branches: [hotfix-illuminated-path-mobile-art-crop]
    paths: [.github/workflows/temporary-hero-crop-review.yml, phase1-illuminated.css]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright @axe-core/playwright
      - name: Capture original SVG artwork at multiple placements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-results
          python3 -m http.server 8877 --bind 127.0.0.1 >/tmp/tyme-crop-local.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          cat > crop-visual-review.mjs <<'JS'
          import { chromium } from 'playwright';
          import { writeFileSync } from 'node:fs';
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome'});
          const context=await browser.newContext({viewport:{width:944,height:900},reducedMotion:'reduce'});
          await context.route(/googletagmanager\\.com|google-analytics\\.com|amazon\\.com|facebook\\.com/,r=>r.abort());
          const page=await context.newPage(), results=[];
          const variants=[
            ['baseline',null],
            ['whole-art-stretch', {backgroundSize:'100% 100%',backgroundPosition:'center center'}],
            ['whole-art-width', {backgroundSize:'100% auto',backgroundPosition:'center bottom'}],
            ['right-focus', {backgroundSize:'auto 100%',backgroundPosition:'right center'}]
          ];
          for(const width of [320,360,390,768,944,1024,1440]){
            await page.setViewportSize({width,height:900});
            await page.goto('http://127.0.0.1:8877/',{waitUntil:'domcontentloaded'});
            await page.locator('.hero-cover').evaluate(img=>img.decode().catch(()=>{}));
            for(const [name,style] of variants){
              const hero=page.locator('.hero');
              if(style) await hero.evaluate((el,st)=>Object.assign(el.style,st),style);
              else await hero.evaluate(el=>{el.style.backgroundSize='';el.style.backgroundPosition='';});
              const data=await page.evaluate(()=>{
                const hero=document.querySelector('.hero'),cover=document.querySelector('.hero-cover');
                const a=hero.getBoundingClientRect(),c=cover.getBoundingClientRect(),s=getComputedStyle(hero);
                return {width:innerWidth,scroll:document.documentElement.scrollWidth,
                  hero:{w:Math.round(a.width),h:Math.round(a.height)},
                  cover:{x:Math.round(c.x),y:Math.round(c.y),w:Math.round(c.width)},
                  bgSize:s.backgroundSize,bgPosition:s.backgroundPosition,
                  svg:s.backgroundImage.includes('illuminated-path-hero.svg')};
              });
              results.push({variant:name,...data});
              if(data.scroll>width+1) throw Error('Horizontal overflow at '+width+'px');
              if(name==='baseline'){
                if(data.bgSize!=='cover')throw Error('Original image aspect ratio changed at '+width+': '+data.bgSize);
                if(width>=741&&width<=1045 && !data.bgPosition.includes('100%')) throw Error('Right-side path not in view at '+width+': '+data.bgPosition);
                if(!data.svg)throw Error('Original landscape SVG missing at '+width);
              }
              await hero.screenshot({path:'qa-results/hero-'+width+'-'+name+'.png',animations:'disabled'});
            }
          }
          writeFileSync('qa-results/crop-comparison.json',JSON.stringify(results,null,2));
          console.log('CROP COMPARISON '+JSON.stringify(results.filter(x=>[390,944].includes(x.width))));
          await browser.close();
          JS
          node crop-visual-review.mjs
          # Use runner's installed Chrome for full regression, avoiding a second download.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('qa/phase1-browser-qa.mjs')
          text=p.read_text()
          old='chromium.launch({ headless:true });'
          assert old in text
          p.write_text(text.replace(old, "chromium.launch({ headless:true, executablePath:'/usr/bin/google-chrome' });"))
          PY
          node qa/phase1-browser-qa.mjs
      - name: Preserve isolated visual comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crop-review-variants
          path: qa-results/
          retention-days: 1
